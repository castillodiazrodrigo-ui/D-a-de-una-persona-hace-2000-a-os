<style>

@font-face{font-family:Cinzel;font-weight:900;src:url(/node_modules/@fontsource/cinzel/files/cinzel-latin-900-normal.woff2)}

html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#gl,#snap{position:absolute;left:0;top:0;width:1080px;height:1920px}

.layer{position:absolute;inset:0;pointer-events:none}
#vignette{background:radial-gradient(ellipse 75% 62% at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}

#fade{background:#000;opacity:0}
#flash{background:#fff;opacity:0}
#subs{position:absolute;left:50%;top:1215px;width:960px;text-align:center;transform:translateX(-50%);font-family:Mont;font-weight:900;font-size:86px;line-height:1.05;letter-spacing:-1px;color:#fff;
  -webkit-text-stroke:0; text-shadow:0 0 2px #000,0 6px 0 rgba(0,0,0,.85),0 0 24px rgba(0,0,0,.6);paint-order:stroke fill}
#subs span{display:inline-block;margin:0 6px;-webkit-text-stroke:14px #120c08;paint-order:stroke fill}
#subs span.off{opacity:.0}

.ttl{position:absolute;white-space:nowrap;font-family:Mont;font-weight:900;color:#fff;text-align:center;-webkit-text-stroke:12px #120c08;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.7)}

.ttl.small{font-size:58px}

.ttl.icon{font-size:150px;-webkit-text-stroke:0;text-shadow:0 8px 20px rgba(0,0,0,.5)}
.ttl .sub{display:block;font-size:.45em;color:#fff;letter-spacing:2px}
.ttl .gold{color:#ffcf3f}
.ttl .blue{color:#9fd8ff}
.ttl .red{color:#ff7b5a}
.ttl .x{color:#ff4a3a}
